name: DummyPay Tests

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      BASE_URL: https://dummypay.vercel.app
      USER_A_EMAIL: ${{ secrets.USER_A_EMAIL }}
      USER_A_PASSWORD: ${{ secrets.USER_A_PASSWORD }}
      USER_B_EMAIL: ${{ secrets.USER_B_EMAIL }}
      USER_B_PASSWORD: ${{ secrets.USER_B_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: python -m pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run all tests
        run: python -m pytest

      - name: Upload report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            reports/
            test-results/
          retention-days: 7
          if-no-files-found: warn